- type: worldgenConfig
  id: NFDefault
  components:
    - type: WorldController
    # Hyperion: worldgen-v1 topology redo. Trojan/FringeRadiation disabled for now
    # (plain-rock gradient first cut). Code stays in the tree; re-enable by uncommenting.
    # Hyperion: worldgen-v1 fissure crossings (Part 1). Rolls the round's inner-to-outer
    # lanes through the Wall; the belt bands carry FissureCarver to read them. See
    # _Hyperion/Worldgen and the design repo worldgen-v1 doc.
    # Re-enabled for the gravitational-rivers lane-visibility rig: the fissure carver is
    # the shipped stand-in for the river carve, so tuning it tunes that. Band widened to
    # run the flattened belt end to end; the inner 500 tiles stay uncarved because the
    # angular half-width (halfWidth / r) blows up as r approaches the hub.
    - type: FissureField
      radiusRange: 500, 40000
      # The carve rejects rock CENTERS, so the pad has to cover the largest rock the band can
      # roll or giants bulge into every lane along its whole length. Ladder tops out at T8
      # radius 67 (Debris/asteroids.yml); 70 leaves a little slack. The stock 48 was sized to
      # the old Colossal and went stale the moment rock sizes changed.
      classes:
      - count: 2
        halfWidthTiles: 40
        overhangPadTiles: 70
        driftAmplitude: 0.22
      - count: 4
        halfWidthTiles: 12
        overhangPadTiles: 70
        driftAmplitude: 0.30
    # Hyperion: worldgen-v1 outer-belt radiation taper (Part 1c). Sourceless per-second dose
    # past ~37k that ramps to the 40k edge; the turn-back tax on the empty drift. See
    # _Hyperion/Worldgen/Systems/FringeRadiationSystem and the design repo worldgen-v1 doc.
    # - type: FringeRadiation # Hyperion: disabled for topology redo
    # Hyperion: worldgen-v1 trojan loot pockets (Part 3). Rolls a few fixed jackpot pockets in
    # the Wall; HyperionBeltWall carries TrojanCarver to read them. See
    # _Hyperion/Worldgen/Systems/TrojanSystem and the design repo worldgen-v1 doc.
    # - type: TrojanField # Hyperion: disabled for topology redo
    - type: BiomeSelection
      biomes:
        # Hyperion: worldgen-v1 belt bands (0-40k) replace the NF/Mono rings;
        # see _Hyperion/World/Biomes/belt.yml and the design repo worldgen-v1 doc.
        # - NFAsteroidsNear # Hyperion: removed, superseded by belt bands
        # - NFAsteroidsMid # Hyperion: removed, superseded by belt bands
        # - NFAsteroidsFar # Hyperion: removed, superseded by belt bands
        # - MonoWorldgenVeryFarT1 # Mono # Hyperion: removed, superseded by belt bands
        # - MonoWorldgenVeryFarT2Inner # Mono # Hyperion: removed, superseded by belt bands
        # - MonoWorldgenVeryFarT2Middle # Mono # Hyperion: removed, superseded by belt bands
        # - MonoWorldgenVeryFarT2Far # Mono # Hyperion: removed, superseded by belt bands
        # Hyperion: flattened test belt for the gravitational-rivers lane-visibility rig.
        # Uniform T4 rock 0-40k so a carved lane has nothing to hide behind. The gradient
        # bands below are parked, not deleted; swap the comments back to restore them.
        - HyperionBeltTest # Hyperion: 0-40k, uniform T4
        # - HyperionBeltCore # Hyperion: 0-7k, T1
        # - HyperionBeltGrad2 # Hyperion: 7-12k, T2
        # - HyperionBeltGrad3 # Hyperion: 12-17k, T3
        # - HyperionBeltGrad4 # Hyperion: 17-22k, T4
        # - HyperionBeltGrad5 # Hyperion: 22-27k, T5
        # - HyperionBeltGrad6 # Hyperion: 27-32k, T6
        # - HyperionBeltGrad7 # Hyperion: 32-37k, T7
        # - HyperionBeltGrad8 # Hyperion: 37-40k, T8
        - HyperionBeltVoid # Hyperion: terminal band, nothing past 40k
