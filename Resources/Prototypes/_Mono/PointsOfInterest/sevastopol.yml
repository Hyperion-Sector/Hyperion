# Notes:
- type: pointOfInterest
  id: Sevastopol
  parent: BasePOI
  name: 'Sevastopol Data Storage Center'
  minimumDistance: 6400
  maximumDistance: 7100
  # Hyperion: hidden class. A data vault has no business on a charted highway. Demoted from
  # Required to its own group (one per round) and sited in the divide between Divisions II and
  # III. Becomes creek-reached and throws no branch once sector topology lands.
  spawnGroup: DataVault
  hideWarp: true
  gridPath: /Maps/_Mono/POI/sevastopol.yml
  addComponents:
  - type: IFF
    color: "#009dff"

- type: gameMap
  id: Sevastopol
  mapName: 'Sevastopol Data Storage Center'
  mapPath: /Maps/_Mono/POI/sevastopol.yml
  minPlayers: 0
  stations:
    Sevastopol:
      stationProto: RecordsFrontierOutpostCargo
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Sevastopol Data Storage Center'
        - type: StationDeadDrop
          maxDeadDrops: 6
