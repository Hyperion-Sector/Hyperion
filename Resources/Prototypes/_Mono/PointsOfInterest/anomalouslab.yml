# Notes:
# The local Science lab
- type: pointOfInterest
  id: AnomalousLab
  parent: BasePOI
  name: 'Anomalous Lab'
  minimumDistance: 10300
  maximumDistance: 11200
  # Hyperion: hidden class. Sited in the divide between Divisions III and IV; becomes
  # creek-reached and throws no branch once sector topology lands.
  spawnGroup: ScienceLab
  hideWarp: true
  gridPath: /Maps/_Mono/POI/anomalouslab.yml
  addComponents:
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: AnomalousLab
  mapName: 'Anomalous Lab'
  mapPath: /Maps/_Mono/POI/anomalouslab.yml
  minPlayers: 0
  stations:
    AnomalousLab:
      stationProto: StandardFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Anomalous Lab'
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
