# Hyperion worldgen-v1 belt bands (0-40k) - topology redo.
# Design: Hyperion-Sector/design proposals/worldgen-v1-belt-economy.md, Part 1.
#
# First cut of the plain-rock gradient. Every band places ONE plain-rock size
# tier (HyperionAsteroidRockT1..T8, see Debris/asteroids.yml); nothing else.
# No material zonation, no gas, no M-type, no fissure/trojan carving - those
# stay in the tree but are disabled at the worldgenConfig (worldgen_default.yml)
# and dropped from the band tables for now.
#
# Size gradient: 0-7k is uniform T1 (the smallest, ~half a Pluto). Past 7k the
# tier steps up every 5k, so rock gets bigger the further out you travel. All
# bands share the DensityBelt channel; the per-band safetyZoneRadius (~= that
# tier's rock radius) is what spaces rocks and stops big tiers from stacking.
# Because a T8 rock is wider than a chunk, the outer bands are necessarily
# fewer-but-bigger; count-per-screen drops outward, by physics not by choice.
# Nothing spawns past 40k (terminal void).

# region Core (0-7k): uniform smallest rock. T1 (~0.5 Pluto).
- type: spaceBiome
  id: HyperionBeltCore
  parent: NFBiomeBase
  priority: 100
  distanceRange: 0, 7000
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: DensityBelt
    randomCancelChance: 0.1 # light thin only; DensityBelt + safetyZoneRadius do the real spacing (default is 0.85, way too sparse)
    safetyZoneRadius: 33
  - type: SimpleDebrisSelector
    debrisTable:
    - id: HyperionAsteroidRockT1
      prob: 1
      orGroup: debris
  - type: NoiseDrivenDebrisSelector # required table (NFBiomeBase provides no default); wrecks untouched this pass
    debrisTable:
    - id: NFWreckDebrisSmall
      prob: 1
      orGroup: wreck

