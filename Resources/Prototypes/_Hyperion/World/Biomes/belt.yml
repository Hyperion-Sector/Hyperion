# Hyperion worldgen-v1 belt bands (0-40k, core-heavy).
# Design: Hyperion-Sector/design proposals/worldgen-v1-belt-economy.md, Part 1.
#
# Nine radial bands replace the NF Near/Mid/Far + Mono VeryFar step function.
# Each band parents NFBiomeBase (ambient carver + wreck selector plumbing) and
# re-adds DebrisFeaturePlacerController to set its density channel, cancel
# jitter, and safety radius. Debris tables are a lean first cut reusing the
# NF asteroid ladder; the ore/gas re-zone pass rewrites them per material.
# Nothing spawns past 40k (the Fringe is the terminal band; beyond is void).

# region Inner apron (0-3k): sparse, open, small rock. The Shallows.
- type: spaceBiome
  id: HyperionBeltApron
  parent: NFBiomeBase
  priority: 100
  distanceRange: 0, 3000
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: DensityRare
    randomCancelChance: 0.4
    safetyZoneRadius: 24
  - type: SimpleDebrisSelector
    debrisTable:
    - id: NFAsteroidDebrisSmall
      prob: 1.5
      orGroup: debris
    - id: NFAsteroidDebrisMedium
      prob: 1.0
      orGroup: debris
    - id: NFAsteroidScrapDebrisSmall
      prob: 0.5
      orGroup: debris
  - type: NoiseDrivenDebrisSelector # required table (NFBiomeBase provides no default)
    debrisTable:
    - id: NFWreckDebrisSmall
      prob: 1
      orGroup: wreck

