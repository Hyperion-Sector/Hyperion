# Hyperion worldgen-v1 belt density channels.
#
# Mechanics (verified against DebrisFeaturePlacerSystem + PoissonDiskSampler):
# - Channel output = Poisson MIN SPACING between rock centers, in tiles,
#   sampled over a 112x112 box per 128-tile chunk. Smaller output = denser.
# - The sampler ALWAYS emits at least one point per chunk. The only ways below
#   1 rock/chunk are randomCancelChance, or channel output of exactly 0
#   (density == 0 aborts the whole chunk).
# - Evaluate: perlin -> remap [0,1] -> (clip) -> *outputMultiplier + minimum.
#   No clipping here, so spacing = [minimum, minimum + outputMultiplier],
#   with FBm values clustering near 0.5.
# - Noise input is CHUNK coords and FastNoiseLite's base frequency is 0.01,
#   so base feature size ~= 100 / inputMultiplier chunks; the finest FBm
#   octave ~= 23 / inputMultiplier chunks. inputMultiplier is the feature-size
#   knob: bigger = smaller pockets/walls.

# The Wall (9.5k-19.5k): maze of big rock. Spacing 15-135, typical ~65-75.
# Low-noise pockets pack near the collision floor (rock extent +
# safetyZoneRadius); high-noise thins to the 1/chunk background. Features
# ~500-2800 tiles: pocket-and-wall structure a capital ship has to thread.
- type: noiseChannel
  id: DensityPeak
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 6
  outputMultiplier: 120.0
  minimum: 15

# Inner reef (3k-9k): busy small/medium boulder fields. Spacing 14-74,
# typical ~4-10 rocks per chunk. Smaller features than the Wall.
- type: noiseChannel
  id: DensityReef
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 8
  outputMultiplier: 60.0
  minimum: 14

# Gap lanes (ring roads): spacing always > chunk box, so this rides the
# 1/chunk floor; the band's randomCancelChance does the real thinning.
- type: noiseChannel
  id: DensityGap
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 1.0
  outputMultiplier: 100.0
  minimum: 150

# Fringe taper (37k-40k): same floor-riding trick, thinned harder by cancel.
- type: noiseChannel
  id: DensityFringe
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 1.0
  outputMultiplier: 300.0
  minimum: 200

# Uniform belt density (worldgen-v1 topology redo). One channel for every
# gradient band; the per-band safetyZoneRadius (~= that tier's rock radius) is
# what actually spaces rocks and keeps big tiers from stacking. This channel
# just oversamples candidate points cheaply and lets the collision cull settle
# them to the per-tier floor. Spacing 55-120, typical ~85 (before the cull).
- type: noiseChannel
  id: DensityBelt
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  inputMultiplier: 6
  outputMultiplier: 65.0
  minimum: 55

# Constant zero: density == 0 aborts the chunk entirely. Terminal void band
# past 40k uses this so out-of-belt chunks spawn nothing.
- type: noiseChannel
  id: DensityZero
  noiseType: Perlin
  outputMultiplier: 0.0
