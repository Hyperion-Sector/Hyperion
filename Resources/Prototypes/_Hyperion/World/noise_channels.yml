# Hyperion worldgen-v1 belt density channels.
#
# DebrisFeaturePlacerSystem feeds a channel's OUTPUT to the Poisson sampler as
# the minimum spacing between rock centers (world units, smaller = denser).
# NoiseChannelPrototype.Evaluate clips the remapped noise BEFORE the output
# multiplier, so (like the stock Density channel) we clip the common noise
# middle to a small constant = the dense-pocket spacing, and let the rare tails
# multiply up into the large-spacing void between clumps. inputMultiplier sets
# clump size; wider clip band = more of the zone is dense.
# Numbers are starting points; final density is a visual-tuning target in-game.

# The Wall (9.5k-19.5k): densest zone. clippedValue 10 (< stock 15.258) and a
# wider clip band so most of the Wall is near-touching Massive/Gigantic rock.
- type: noiseChannel
  id: DensityPeak
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.35, 0.65
  clippedValue: 10
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

# Inner reef (3k-9k): clumped boulder fields, ~stock density.
- type: noiseChannel
  id: DensityReef
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.4, 0.6
  clippedValue: 15
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

# Gap lanes (ring roads): narrow clip band = rare sparse pockets, mostly void.
- type: noiseChannel
  id: DensityGap
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.47, 0.53
  clippedValue: 28
  inputMultiplier: 3
  outputMultiplier: 5000.0
  minimum: 0.25

# Fringe taper (37k-40k): the fade. Very narrow clip = almost all void.
- type: noiseChannel
  id: DensityFringe
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.49, 0.51
  clippedValue: 40
  inputMultiplier: 3
  outputMultiplier: 7500.0
  minimum: 0.25
