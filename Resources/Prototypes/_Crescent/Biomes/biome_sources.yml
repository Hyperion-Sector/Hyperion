- type: entity
  id: BiomeSourceFarReachesIV
  parent: BaseBiomeSource
  name: far reaches IV biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionDrifts # Hyperion: BiomeFarReachesIV -> drift + fringe to the 40k edge
    swapDistance: 40000 # Hyperion: 50000 -> 40000 (Uncharted Space fallback past here)
    priority: 1400 # Hyperion: 125 -> 1400

- type: entity
  id: BiomeSourceFarReachesIII
  parent: BaseBiomeSource
  name: far reaches III biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionSnowline # Hyperion: BiomeFarReachesIII -> ice ramp
    swapDistance: 33000 # Hyperion: 30000 -> 33000
    priority: 1500 # Hyperion: 250 -> 1500

- type: entity
  id: BiomeSourceFarReachesII
  parent: BaseBiomeSource
  name: far reaches II biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionTailings # Hyperion: BiomeFarReachesII -> exhaust + scrap basin
    swapDistance: 22000 # Hyperion: 25000 -> 22000
    priority: 1600 # Hyperion: 500 -> 1600

- type: entity
  id: BiomeSourceFarReachesI
  parent: BaseBiomeSource
  name: far reaches I biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionGrinder # Hyperion: BiomeFarReachesI -> Wall core
    swapDistance: 17000 # Hyperion: 22000 -> 17000
    priority: 1700 # Hyperion: 750 -> 1700

- type: entity
  id: BiomeSourceOuterRing
  parent: BaseBiomeSource
  name: outer ring biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionWreckingFace # Hyperion: BiomeOuterRing -> Wall intake
    swapDistance: 12000 # Hyperion: 18000 -> 12000
    priority: 1800 # Hyperion: 1000 -> 1800

- type: entity
  id: BiomeSourceMiddleRing
  parent: BaseBiomeSource
  name: middle ring biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionReefs # Hyperion: BiomeMiddleRing -> Reefs (Low Lane rides this shell)
    swapDistance: 9500 # Hyperion: 10000 -> 9500
    priority: 1900 # Hyperion: 1500 -> 1900 (strict descent outward)

- type: entity
  id: BiomeSourceInnerRing
  parent: BaseBiomeSource
  name: inner ring biome source
  components:
  - type: SpaceBiomeSource
    id: BiomeHyperionShallows # Hyperion: BiomeInnerRing -> Shallows
    swapDistance: 3000 # Hyperion: 5000 -> 3000
    priority: 2000
